services:
  - type: web
    name: portfolio-backend
    env: python
    root: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
