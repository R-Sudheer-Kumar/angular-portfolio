services:
  - type: web
    name: portfolio-backend
    env: python
    root: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "ls -R && python -c 'import sys; print(sys.path); import app.main; print(\"Import Success\")' && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: .
